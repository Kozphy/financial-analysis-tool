[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analysis-tool"
version = "0.1.0"
description = "Analyze company financial statement trends and generate presentation-ready metrics and charts."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["finance", "accounting", "analytics", "esg", "sustainability"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage>=7.6",
]
esg = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "seaborn>=0.13",
]
ui = [
    "pandas>=2.2",
    "streamlit>=1.44",
]
full = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "seaborn>=0.13",
    "streamlit>=1.44",
]

[project.scripts]
financial-analysis-tool = "financial_analysis_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
