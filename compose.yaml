services:
  financial:
    build:
      context: .
    command:
      - financial-analysis-tool
      - --input
      - data/financials.csv
      - --summary-output
      - output/reports/financial_summary.json
      - --report-output
      - output/reports/executive_summary.md
      - --profitability-chart-output
      - output/charts/profitability_trends.svg
      - --financial-position-chart-output
      - output/charts/financial_position_trends.svg
    volumes:
      - ./output:/app/output
