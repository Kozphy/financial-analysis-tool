services:
  financial:
    build:
      context: .
    command:
      - financial-analysis-tool
      - --input
      - data/financials.csv
      - --summary-output
      - output/financial/summary.json
      - --chart-output
      - output/charts/financial-trends.svg
    volumes:
      - ./output:/app/output

  backtest:
    build:
      context: .
    profiles:
      - backtest
    command:
      - financial-analysis-tool
      - backtest
      - --prices
      - data/prices.csv
      - --backtest-output
      - output/backtests/backtest.json
    volumes:
      - ./output:/app/output
